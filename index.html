<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>UPSC 360 Command Centre</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: an exam answer-sheet desk. Sticky header + tabs, a D-day hero, then a 2-column work grid that stacks on phones.
   Ink-blue pen on cool paper, a highlighter for what matters, OMR ovals for mastery stages. */
:root{
  --paper:#EEF1F6; --sheet:#FFFFFF; --sheet-2:#E6EAF1; --rule:#D3DAE6;
  --ink:#141D33; --ink-2:#47536E; --ink-3:#7A86A0;
  --pen:#2441A6; --pen-soft:rgba(36,65,166,.09); --on-pen:#FFFFFF;
  --mark:#F4C23E; --mark-soft:rgba(244,194,62,.42);
  --good:#1D8752; --good-soft:rgba(29,135,82,.12);
  --warn:#A86A12; --warn-soft:rgba(168,106,18,.12);
  --bad:#BE3A33; --bad-soft:rgba(190,58,51,.10);
  --h0:#E1E6EE; --h1:#C5D0F0; --h2:#8FA3E3; --h3:#5470CF; --h4:#2441A6;
  --shadow:0 1px 2px rgba(20,29,51,.05),0 6px 20px -12px rgba(20,29,51,.18);
  --slab:#16213D; --on-slab:#EEF1F6;
  --f-display:'Spectral',Georgia,'Times New Roman',serif;
  --f-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1220; --sheet:#151C2E; --sheet-2:#1C2540; --rule:#28324D;
  --ink:#E5E9F3; --ink-2:#A2ADC6; --ink-3:#6E7A95;
  --pen:#8EA5FF; --pen-soft:rgba(142,165,255,.13); --on-pen:#0D1220;
  --mark:#E3B235; --mark-soft:rgba(227,178,53,.26);
  --good:#4CC38A; --good-soft:rgba(76,195,138,.14);
  --warn:#E2A84B; --warn-soft:rgba(226,168,75,.14);
  --bad:#F0716A; --bad-soft:rgba(240,113,106,.13);
  --h0:#1B233A; --h1:#25356A; --h2:#3A55A8; --h3:#5F7BE0; --h4:#93A9FF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
  --slab:#1F2C52; --on-slab:#E9EDF7;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0D1220; --sheet:#151C2E; --sheet-2:#1C2540; --rule:#28324D;
  --ink:#E5E9F3; --ink-2:#A2ADC6; --ink-3:#6E7A95;
  --pen:#8EA5FF; --pen-soft:rgba(142,165,255,.13); --on-pen:#0D1220;
  --mark:#E3B235; --mark-soft:rgba(227,178,53,.26);
  --good:#4CC38A; --good-soft:rgba(76,195,138,.14);
  --warn:#E2A84B; --warn-soft:rgba(226,168,75,.14);
  --bad:#F0716A; --bad-soft:rgba(240,113,106,.13);
  --h0:#1B233A; --h1:#25356A; --h2:#3A55A8; --h3:#5F7BE0; --h4:#93A9FF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
  --slab:#1F2C52; --on-slab:#E9EDF7;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px;border-radius:6px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:22px;font-weight:600}
h3{font-size:18px;font-weight:600}
p{margin:0}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.hl{background:linear-gradient(180deg,transparent 58%,var(--mark-soft) 58%,var(--mark-soft) 92%,transparent 92%);padding:0 .08em}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar{display:flex;align-items:center;gap:12px;padding-block:12px 6px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:-.01em}
.brand b i{font-style:normal;color:var(--pen)}
.brand span{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink-2);padding:6px 10px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.status[data-s="saved"] i{background:var(--good)}
.status[data-s="saving"] i{background:var(--mark);animation:pulse 1s infinite}
.status[data-s="error"] i,.status[data-s="unreachable"] i{background:var(--bad)}
@keyframes pulse{50%{opacity:.35}}
.minitimer{display:none;align-items:center;gap:6px;font-family:var(--f-mono);font-size:13px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--pen);color:var(--on-pen);border:0;cursor:pointer}
.minitimer.on{display:inline-flex}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;padding:10px 12px 11px;font-weight:600;font-size:14px;color:var(--ink-2);border-bottom:2.5px solid transparent;white-space:nowrap;cursor:pointer;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pen)}
.tab .tc{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);font-weight:500}

main{padding-block:22px 64px;display:flex;flex-direction:column;gap:20px}

/* generic */
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h > div{min-width:0}
.card-h p{font-size:13px;color:var(--ink-2);margin-top:3px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.grid3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:20px;align-items:start}
@media (max-width:900px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);padding:8px 13px;border-radius:9px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--pen);border-color:var(--pen);color:var(--on-pen)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.quiet:hover{background:var(--sheet-2);color:var(--ink)}
.ib{appearance:none;border:0;background:transparent;color:var(--ink-3);width:30px;height:30px;border-radius:8px;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.ib:hover{background:var(--sheet-2);color:var(--ink)}
.ib.del:hover{color:var(--bad);background:var(--bad-soft)}
.ic{width:16px;height:16px;flex:none}
.in{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);font-size:14px;min-width:0}
.in:focus{outline:none;border-color:var(--pen);box-shadow:0 0 0 3px var(--pen-soft)}
textarea.in{resize:vertical;line-height:1.5}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink-2);min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--rule);background:var(--sheet);color:var(--ink-2);padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--pen-soft);color:var(--pen);white-space:nowrap}
.tag.gold{background:var(--mark-soft);color:var(--ink)}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.plain{background:var(--sheet-2);color:var(--ink-2)}
.empty{padding:22px;text-align:center;color:var(--ink-3);font-size:14px;border:1.5px dashed var(--rule);border-radius:10px}
.search{position:relative;min-width:0;flex:1 1 200px;max-width:320px}
.search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search .in{padding-left:32px}
.bar-track{height:7px;border-radius:99px;background:var(--sheet-2);overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:var(--pen);transition:width .5s}
.bar-fill.good{background:var(--good)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,2fr);gap:20px;align-items:stretch}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}}
.dday{background:var(--slab);color:var(--on-slab);border-radius:var(--r);padding:20px 22px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;position:relative;overflow:hidden}
.dday .eyebrow{color:color-mix(in srgb,var(--on-slab) 62%,transparent)}
.dday .big{font-family:var(--f-display);font-weight:700;font-size:clamp(56px,9vw,84px);line-height:.95;letter-spacing:-.02em}
.dday .big .hl{background:linear-gradient(180deg,transparent 62%,var(--mark) 62%,var(--mark) 90%,transparent 90%);color:var(--on-slab)}
.dday .sub{font-size:13.5px;color:color-mix(in srgb,var(--on-slab) 72%,transparent)}
.dday .sub b{color:var(--on-slab)}
.dday .lines{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,transparent 0 27px,color-mix(in srgb,var(--on-slab) 6%,transparent) 27px 28px)}
.dday > *{position:relative}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 15px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);min-width:0;cursor:pointer;text-align:left;appearance:none}
.kpi:hover{border-color:var(--ink-3)}
.kpi .v{font-family:var(--f-display);font-size:32px;font-weight:700;line-height:1}
.kpi .v small{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--ink-3);margin-left:3px}
.kpi .d{font-size:12.5px;color:var(--ink-2)}
.ringrow{display:flex;align-items:center;gap:12px}
.ring{flex:none}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:var(--sheet-2)} .ring .fg{stroke:var(--pen);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring.done .fg{stroke:var(--good)}

/* tasks */
.task{display:flex;align-items:center;gap:10px;padding:9px 8px 9px 10px;border-radius:10px;border:1px solid var(--rule);background:var(--sheet)}
.task:hover{border-color:var(--ink-3)}
.task.done{background:var(--paper);border-color:transparent}
.task.done .tt{text-decoration:line-through;color:var(--ink-3)}
.task .tt{flex:1;min-width:0;font-size:14.5px;font-weight:500;overflow-wrap:anywhere}
.chk{appearance:none;width:22px;height:22px;border-radius:7px;border:1.8px solid var(--ink-3);background:transparent;display:grid;place-items:center;cursor:pointer;flex:none;color:var(--on-pen)}
.chk[aria-checked="true"]{background:var(--good);border-color:var(--good)}
.chk .ic{width:14px;height:14px;opacity:0}
.chk[aria-checked="true"] .ic{opacity:1}
.subhead{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;margin-bottom:12px}
@media (max-width:560px){.addrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important}.addrow .in:first-child{grid-column:1/-1}.addrow .btn{grid-column:1/-1}.task{flex-wrap:wrap;row-gap:6px}.task .tt{flex:1 1 calc(100% - 40px)}.task .tt + *{margin-left:32px}}

/* timer */
.timer{background:var(--slab);color:var(--on-slab);border-radius:10px;padding:18px;text-align:center}
.timer .clock{font-family:var(--f-mono);font-size:52px;font-weight:600;letter-spacing:.02em;line-height:1.1}
.timer .lbl{font-size:12.5px;color:color-mix(in srgb,var(--on-slab) 65%,transparent);margin-top:4px}
.timer .row{justify-content:center;margin-top:14px}
.timer .btn{background:color-mix(in srgb,var(--on-slab) 10%,transparent);border-color:color-mix(in srgb,var(--on-slab) 18%,transparent);color:var(--on-slab)}
.timer .btn.go{background:var(--mark);border-color:var(--mark);color:#141D33}
.presets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:12px}
.presets .btn{padding:7px 4px;font-size:12.5px}
.presets .btn[aria-pressed="true"]{border-color:var(--pen);color:var(--pen);background:var(--pen-soft)}

/* week bars */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:130px;position:relative;padding-top:6px}
.wk{display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end;min-width:0}
.wk .b{width:100%;max-width:34px;border-radius:6px 6px 3px 3px;background:var(--h2);min-height:3px;transition:height .5s}
.wk.today .b{background:var(--pen)}
.wk.hit .b{background:var(--good)}
.wk .l{font-size:11.5px;color:var(--ink-3);font-weight:600}
.wk .n{font-family:var(--f-mono);font-size:11px;color:var(--ink-2)}
.target-line{position:absolute;left:0;right:0;border-top:1.5px dashed var(--mark);pointer-events:none}
.target-line span{position:absolute;right:0;top:-17px;font-size:10.5px;font-weight:700;color:var(--warn);background:var(--sheet);padding:0 4px}

/* tables */
.tw{overflow-x:auto;margin-inline:-18px;padding-inline:18px}
table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
.t th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:8px 10px;border-bottom:1.5px solid var(--rule);white-space:nowrap}
.t td{padding:11px 10px;border-bottom:1px solid var(--rule);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr:hover td{background:color-mix(in srgb,var(--sheet-2) 45%,transparent)}
.t .paper{font-weight:700;color:var(--pen);white-space:nowrap}
.t .subj{font-weight:600;white-space:nowrap}
.t .topic{color:var(--ink-2);min-width:220px}
.t .r{text-align:right}

/* OMR stage ovals */
.omr{display:inline-flex;align-items:center;gap:5px}
.bub{appearance:none;width:24px;height:15px;border-radius:50%;border:1.6px solid var(--ink-3);background:transparent;cursor:pointer;padding:0;position:relative;font-family:var(--f-mono);font-size:8.5px;font-weight:600;color:var(--ink-3);line-height:1}
.bub:hover{border-color:var(--pen);color:var(--pen)}
.bub.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.bub.on.full{background:var(--good);border-color:var(--good);color:var(--on-pen)}
.stl{font-size:12px;font-weight:600;min-width:84px;display:inline-block;margin-left:6px;color:var(--ink-2)}
.stl.s4{color:var(--good)}
.stl.s0{color:var(--ink-3)}
.pyq{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--rule);border-radius:8px;background:var(--paper)}
.pyq button{appearance:none;border:0;background:none;width:24px;height:26px;cursor:pointer;color:var(--ink-3);font-weight:700}
.pyq button:hover{color:var(--pen)}
.pyq span{font-family:var(--f-mono);font-size:12.5px;min-width:46px;text-align:center}
.paperbars{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.pb{padding:11px 12px;border-radius:10px;background:var(--paper);border:1px solid var(--rule);display:flex;flex-direction:column;gap:7px;cursor:pointer;text-align:left;appearance:none}
.pb[aria-pressed="true"]{border-color:var(--pen);box-shadow:0 0 0 2px var(--pen-soft)}
.pb .row{justify-content:space-between}
.pb b{font-size:13.5px}
.pb .num{font-size:13px;color:var(--ink-2)}
.addtopic{display:grid;grid-template-columns:120px minmax(0,1fr) minmax(0,2fr) 90px auto;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--rule)}
@media (max-width:760px){.addtopic{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.addtopic > :nth-child(3){grid-column:1/-1}}

/* notes */
.drop{border:1.8px dashed var(--rule);border-radius:12px;padding:22px;text-align:center;cursor:pointer;background:var(--paper);transition:border-color .15s,background .15s}
.drop:hover,.drop.on{border-color:var(--pen);background:var(--pen-soft)}
.drop b{display:block;font-size:14.5px}
.drop span{font-size:12.5px;color:var(--ink-3)}
.note{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px 16px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px;min-width:0}
.note h4{margin:0;font-family:var(--f-display);font-size:18px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.note .body{font-size:14px;color:var(--ink-2);white-space:pre-line;overflow-wrap:anywhere}
.note .body.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.note .meta{font-size:12px;color:var(--ink-3)}
.file{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;background:var(--paper);border:1px solid var(--rule)}
.file .ext{font-family:var(--f-mono);font-size:11px;font-weight:600;padding:3px 6px;border-radius:6px;background:var(--good-soft);color:var(--good)}
.file .fn{flex:1;min-width:0;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file a{color:var(--pen);font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
.kw{font-size:11.5px;color:var(--ink-3);font-family:var(--f-mono)}
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
@media (max-width:420px){.notes-grid{grid-template-columns:minmax(0,1fr)}}
.thinker{padding:14px 14px 12px;border-radius:10px;border:1px solid var(--rule);background:var(--paper);display:flex;flex-direction:column;gap:6px}
.thinker q{font-family:var(--f-display);font-style:italic;font-size:16px;line-height:1.45;quotes:"\201C" "\201D"}

/* mocks */
.calc{background:var(--slab);color:var(--on-slab);border-radius:10px;padding:14px 16px}
.calc .score{font-family:var(--f-mono);font-size:34px;font-weight:600;line-height:1.1}
.calc .score.safe{color:var(--mark)}
.calc .small{font-size:12px;color:color-mix(in srgb,var(--on-slab) 65%,transparent)}

  return {id:String(n.id||uid('n')).replace(/[^A-Za-z0-9_.~:@+-]/g,'_'), title:String(n.title||'Untitled note'), category:NOTE_CATEGORIES.includes(n.category)?n.category:(n.category?String(n.category):NOTE_CATEGORIES[0]),

/* old tracker backups (v2) and this tracker's own backups (v3) */
function migrate(obj){
  if(!obj || typeof obj !== 'object') throw new Error('not an object');
  if(obj.format === 'upsc360'){
    return {core:normCore(obj.core), days:normDays(obj.days), notes:(obj.notes||[]).map(normNote)};
  }
  const looksOld = obj.syllabus || obj.optionalData || obj.tasks || obj.notes || obj.mocks;
  if(!looksOld) throw new Error('unknown format');
  const core = normCore({
    settings:{theme: typeof obj.darkMode==='boolean' ? (obj.darkMode?'dark':'light') : 'system', selectedOptional: obj.selectedOptional},
    syllabus: obj.syllabus, optionalData: obj.optionalData, thinkers: obj.optionalThinkers, mocks: obj.mocks
  });
  const exportedDay = obj.exportedAt ? dkey(new Date(obj.exportedAt)) : today();
  const days = normDays({tasks:(obj.tasks||[]).map(t => Object.assign({}, t, {date: exportedDay})), routine: undefined});
  days.routine = [];
  const me = Array.isArray(obj.peers) ? obj.peers.find(p => p && p.id === 'p4') : null;
  if(me && num(me.hoursToday,0) > 0) days.log[exportedDay] = {min:Math.round(num(me.hoursToday)*60), note:'', sessions:0, routine:[]};
  return {core, days, notes:(obj.notes||[]).map(normNote)};
}

const dayLog = (k, create) => { let L = S.days.log[k]; if(!L && create){ L = S.days.log[k] = {min:0, note:'', sessions:0, routine:[]}; } return L || {min:0, note:'', sessions:0, routine:[]}; };

/* ---------- persistence ---------- */
const LKEY = 'upsc360_vault_v3';
const Store = {
  db:null, assets:null, downloads:null,
  dirty:{core:false, days:false}, inflight:{core:false, days:false}, t:{},
  noteChain:Promise.resolve(), notePending:0, error:false,
  busy(){ return this.dirty.core || this.dirty.days || this.inflight.core || this.inflight.days || this.notePending > 0; },
  mark(which, now){
    if(S.mode === 'loading') return;
    this.dirty[which] = true; this.error = false; paintStatus();
    clearTimeout(this.t[which]);
    this.t[which] = setTimeout(() => this.flush(which), now ? 0 : 600);
  },
  async flush(which){
    clearTimeout(this.t[which]);
    if(!this.dirty[which]) return;
    if(S.mode === 'local'){ this.dirty[which] = false; saveLocal(); paintStatus(); return; }
    if(S.mode !== 'cloud' || this.inflight[which]) return;
    this.dirty[which] = false; this.inflight[which] = true; paintStatus();
    try { await writeDoc(this.db.doc('vault/' + which), clone(S[which])); }
    catch(e){ this.dirty[which] = true; this.error = true; reportSaveError(e); }
    this.inflight[which] = false;
    if(this.dirty[which] && !this.error) this.flush(which);
    paintStatus();
  },
  flushAll(){ this.flush('core'); this.flush('days'); },
  note(op){ // op: () => Promise
    if(S.mode === 'local'){ saveLocal(); paintStatus(); return; }
    if(S.mode !== 'cloud') return;
    this.notePending++; paintStatus();
    this.noteChain = this.noteChain.then(op).catch(e => { this.error = true; reportSaveError(e); }).then(() => { this.notePending--; paintStatus(); });
  }
};
async function writeDoc(ref, body){
  try { await ref.set(body); }
  catch(e){
    if(e && (e.code === 'unavailable' || !e.code)){ await new Promise(r => setTimeout(r, 700 + Math.random()*800)); await ref.set(body); }
    else throw e;
  }
}
function reportSaveError(e){
  const c = e && e.code;
  if(c === 'quota_exceeded') toast('Storage is full. Delete some old notes or files, then edit again to save.', 6000);
  else if(c === 'invalid_argument') toast('That change was too large to save in one place. Trim long notes or old log entries.', 6000);
  else if(c === 'revoked') toast('Saving was switched off for this view. Reload the page.', 6000);
  else toast('Couldn’t save just now. Your next edit will try again.', 4500);
  paintStatus();
}
function saveLocal(){
  try { localStorage.setItem(LKEY, JSON.stringify({core:S.core, days:S.days, notes:S.notes})); Store.error = false; }
  catch(e){ Store.error = true; toast('This browser refused to save (storage full or blocked). Download a backup from Settings.', 6000); }
}
function loadLocal(){
  try { const raw = localStorage.getItem(LKEY); if(raw){ const o = JSON.parse(raw); return {core:normCore(o.core), days:normDays(o.days), notes:(o.notes||[]).map(normNote)}; } } catch(e){}
  return null;
}
function paintStatus(){
  const el = $('#status'); if(!el) return;
  let s, t;

  else if(Store.error){ s = 'error'; t = 'Not saved yet'; }
  else if(Store.busy()){ s = 'saving'; t = 'Saving…'; }
  else if(S.mode === 'cloud'){ s = 'saved'; t = 'Saved to your account'; }
  else { s = 'saved'; t = 'Saved in this browser'; }
  el.dataset.s = s; el.lastElementChild.textContent = t;

}

/* ---------- boot ---------- */
let rootTheme = null;
function applyTheme(){
  const t = S.core ? S.core.settings.theme : 'system';
  const r = document.documentElement;
  if(rootTheme === null) rootTheme = r.getAttribute('data-theme') || '';
  if(t === 'light' || t === 'dark') r.setAttribute('data-theme', t);
  else if(rootTheme) r.setAttribute('data-theme', rootTheme); else r.removeAttribute('data-theme');
}
function pruneOld(){
  const cut = addDays(today(), -60);
  const before = S.days.tasks.length;
  S.days.tasks = S.days.tasks.filter(t => !(t.done && t.date < cut));
  return before !== S.days.tasks.length;
}
function startLocal(){
  const saved = loadLocal();
  if(saved){ S.core = saved.core; S.days = saved.days; S.notes = saved.notes; }
  else { S.core = defaultCore(); S.days = defaultDays(); S.notes = defaultNotes(); UI.firstRun = true; }
  S.mode = 'local'; pruneOld(); applyTheme(); render(); paintStatus();
}
async function boot(){
  renderTabs();
  const c = window.claude;
  if(!c || typeof c.use !== 'function'){ startLocal(); return; }
  let db = null;
  try { db = await c.use('db'); } catch(e){ db = null; }
  if(!db){ startLocal(); return; }
  Store.db = db;
  c.use('assets').then(a => { Store.assets = a; }).catch(()=>{});
  c.use('downloads').then(d => { Store.downloads = d; }).catch(()=>{});

  const got = {core:null, days:null};
  let notesReady = false, started = false;
  const slow = setTimeout(() => { UI.slow = true; paintStatus(); if(S.mode==='loading') $('#main').innerHTML = '<div class="loading"><h2>Still connecting…</h2><p>Your saved progress can’t be reached yet. Keep this page open; it will load as soon as the connection returns.</p></div>'; }, 10000);
  const maybeStart = () => {
    if(started || !got.core || !got.days || !notesReady) return;
    started = true; clearTimeout(slow); UI.slow = false;
    const fresh = !got.core.exists && !got.days.exists;
    S.core = got.core.exists ? normCore(got.core.data()) : defaultCore();
    S.days = got.days.exists ? normDays(got.days.data()) : defaultDays();
    if(fresh && !S.notes.length){ S.notes = defaultNotes(); UI.firstRun = true; UI.seedNotes = true; }
    S.mode = 'cloud';
    if(pruneOld()) Store.mark('days');
    applyTheme(); render(); paintStatus();
  };
  const onDoc = which => snap => {
    if(snap.metadata && snap.metadata.fromCache && !started) return; // wait for the store's answer before allowing edits
    if(!started){ got[which] = snap; maybeStart(); return; }
    if(Store.dirty[which] || Store.inflight[which] || (snap.metadata && snap.metadata.hasPendingWrites)) return;
    if(!snap.exists) return;
    const incoming = which === 'core' ? normCore(snap.data()) : normDays(snap.data());
    if(JSON.stringify(incoming) === JSON.stringify(S[which])) return;
    S[which] = incoming; if(which==='core') applyTheme();
    softRender();
  };
  const onErr = e => { if(!started){ clearTimeout(slow); toast('Couldn’t open your saved data. Working in this browser instead.', 5000); startLocal(); } else { Store.error = true; paintStatus(); } };
  db.doc('vault/core').onSnapshot(onDoc('core'), onErr);
  db.doc('vault/days').onSnapshot(onDoc('days'), onErr);
  db.collection('notes').onSnapshot(snap => {
    if(snap.metadata && snap.metadata.fromCache && !notesReady) return;
    const list = snap.docs.filter(d => d.exists).map(d => normNote(d.data()));
    list.sort((a,b) => b.created - a.created);
    if(!notesReady){ notesReady = true; S.notes = list; maybeStart(); return; }
    if(UI.seedNotes && !list.length) return;
    UI.seedNotes = false;
    S.notes = list; softRender();
  }, onErr);
}

function ring(p, size){

function streakInfo(){
  const L = S.days.log, t = today();
  const active = k => (L[k] && (L[k].min > 0 || (L[k].routine||[]).length)) || S.days.tasks.some(x => x.done && x.doneAt === k);
  let cur = 0, k = active(t) ? t : addDays(t,-1);
  while(active(k)){ cur++; k = addDays(k,-1); }
  const keys = Object.keys(L).concat(S.days.tasks.filter(x=>x.done&&x.doneAt).map(x=>x.doneAt)).filter(isKey).sort();

/* --- MOCKS --- */
const net = m => { const T = MOCK_TYPES[m.type]||MOCK_TYPES.GS; return m.correct*T.plus - m.incorrect*T.minus; };
function chart(list, type){
  const T = MOCK_TYPES[type], cut = type==='GS' ? S.core.settings.gsCutoff : CSAT_QUALIFY;
  if(!list.length) return '<div class="empty">Log a '+(type==='GS'?'GS':'CSAT')+' mock to see your score line here.</div>';
  const W = 640, H = 230, l = 40, r = 16, tp = 16, b = 34, iw = W-l-r, ih = H-tp-b;
  const X = i => l + (list.length===1 ? iw/2 : i*iw/(list.length-1)), Y = v => tp + ih - clamp(v,0,T.max)/T.max*ih;
  let g = '';
  [0,50,100,150,200].forEach(v => { g += '<line class="grid" x1="'+l+'" x2="'+(W-r)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(l-8)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v+'</text>'; });
  g += '<line class="cut" x1="'+l+'" x2="'+(W-r)+'" y1="'+Y(cut)+'" y2="'+Y(cut)+'"/><text class="cutlbl" x="'+(W-r)+'" y="'+(Y(cut)-6)+'" text-anchor="end">'+(type==='GS'?'Your cut-off target '+cut:'CSAT qualifying 66.67')+'</text>';
  const pts = list.map((m,i)=>[X(i),Y(net(m))]);
  if(pts.length>1) g += '<path class="area" d="M'+pts[0][0]+' '+Y(0)+' L'+pts.map(p=>p.join(' ')).join(' L')+' L'+pts[pts.length-1][0]+' '+Y(0)+' Z"/><path class="line" d="M'+pts.map(p=>p.join(' ')).join(' L')+'"/>';
  const every = Math.ceil(list.length/7);
  list.forEach((m,i) => { g += '<circle class="pt'+(i===list.length-1?' last':'')+'" cx="'+pts[i][0]+'" cy="'+pts[i][1]+'" r="'+(i===list.length-1?5.5:4)+'"><title>'+esc(m.name)+': '+net(m).toFixed(2)+'</title></circle>'; if(i%every===0 || i===list.length-1) g += '<text x="'+pts[i][0]+'" y="'+(H-12)+'" text-anchor="'+(list.length>1 && i===list.length-1?'end':(list.length>1 && i===0?'start':'middle'))+'">'+esc(fmt(m.date))+'</text>'; });
  const last = net(list[list.length-1]);
  g += '<text x="'+clamp(pts[pts.length-1][0],l+20,W-r-20)+'" y="'+(pts[pts.length-1][1]-12)+'" text-anchor="middle" style="fill:var(--ink);font-weight:600">'+last.toFixed(1)+'</text>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Mock score trend">'+g+'</svg>';
}
function vMocks(){
  const f = UI.mock, T = MOCK_TYPES[f.type];
  const c = clamp(int(f.correct,0),0,T.q), w = clamp(int(f.incorrect,0),0,T.q-c);
  const score = c*T.plus - w*T.minus, cut = f.type==='GS' ? S.core.settings.gsCutoff : CSAT_QUALIFY;
  const acc = c+w ? Math.round(c/(c+w)*100) : 0;
  const all = S.core.mocks.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const ofType = all.filter(m=>m.type===UI.chartType);
  const best = ofType.length ? Math.max(...ofType.map(net)) : 0, avg = ofType.length ? ofType.reduce((a,m)=>a+net(m),0)/ofType.length : 0;
  return '<div class="grid3">' +
    '<section class="card"><div class="card-h"><div><h3>Score a mock</h3><p>'+(f.type==='GS'?'+2 for correct, −0.66 (one third) for wrong, 100 questions.':'+2.5 for correct, −0.83 for wrong, 80 questions. Qualifying at 66.67.')+'</p></div></div>' +
      '<form class="stack" data-form="mock-add"><div class="chips">'+Object.keys(MOCK_TYPES).map(k=>'<button type="button" class="chip" data-act="mock-type" data-t="'+k+'" aria-pressed="'+(f.type===k)+'">'+MOCK_TYPES[k].label+'</button>').join('')+'</div>' +
      '<label class="f">Test name<input class="in" id="mock-name" data-input="mock.name" name="name" required value="'+esc(f.name)+'" placeholder="e.g. Vision FL-4 or PYQ 2025" autocomplete="off"></label>' +
      '<div class="row" style="flex-wrap:nowrap"><label class="f" style="flex:1"><span style="color:var(--good)">Correct</span><input class="in num" type="number" id="mock-c" data-input="mock.correct" min="0" max="'+T.q+'" value="'+esc(f.correct)+'"></label><label class="f" style="flex:1"><span style="color:var(--bad)">Wrong</span><input class="in num" type="number" id="mock-w" data-input="mock.incorrect" min="0" max="'+T.q+'" value="'+esc(f.incorrect)+'"></label><label class="f" style="flex:1">Date<input class="in" type="date" id="mock-d" name="date" value="'+today()+'"></label></div>' +
      '<div class="calc" id="calc"><div class="row" style="justify-content:space-between"><span class="small">Attempted '+(c+w)+'/'+T.q+' · skipped '+(T.q-c-w)+' · accuracy '+acc+'%</span></div><div class="row" style="justify-content:space-between;align-items:baseline;margin-top:6px"><span class="small">Net score</span><span class="score'+(score>=cut?' safe':'')+'">'+score.toFixed(2)+'<span class="small"> / '+T.max+'</span></span></div><div class="small" style="margin-top:4px">'+(score>=cut ? (f.type==='GS'?'At or above your cut-off target of '+cut+'.':'Qualifies.') : (f.type==='GS'?(cut-score).toFixed(1)+' below your cut-off target. Fewer wild guesses cut the penalty.':'Below the qualifying mark by '+(cut-score).toFixed(1)+'.'))+'</div></div>' +
      '<button class="btn primary" type="submit">Save to mock log</button></form>' +
    '</section>' +
    '<section class="card"><div class="card-h"><div><h3>Score trend</h3><p>'+(ofType.length ? ofType.length+' tests · best '+best.toFixed(1)+' · average '+avg.toFixed(1) : 'No tests of this type yet')+'</p></div><div class="chips">'+Object.keys(MOCK_TYPES).map(k=>'<button class="chip" data-act="chart-type" data-t="'+k+'" aria-pressed="'+(UI.chartType===k)+'">'+(k==='GS'?'GS':'CSAT')+'</button>').join('')+'</div></div>' +
      chart(ofType, UI.chartType) +
      '<div class="tw" style="margin-top:14px"><table class="t" style="min-width:560px"><thead><tr><th>Test</th><th>Type</th><th>Date</th><th>Right / wrong</th><th>Accuracy</th><th class="r">Net</th><th></th></tr></thead><tbody>' +
      (all.length ? all.slice().reverse().map(m => { const T2 = MOCK_TYPES[m.type]; const nn = net(m); const ok = nn >= (m.type==='GS'?S.core.settings.gsCutoff:CSAT_QUALIFY); return '<tr><td style="font-weight:600">'+esc(m.name)+'</td><td><span class="tag plain">'+(m.type==='GS'?'GS':'CSAT')+'</span></td><td class="faint" style="white-space:nowrap">'+esc(fmt(m.date,{day:'numeric',month:'short',year:'2-digit'}))+'</td><td class="num"><span style="color:var(--good)">'+m.correct+'✓</span> / <span style="color:var(--bad)">'+m.incorrect+'✗</span> <span class="faint">of '+T2.q+'</span></td><td class="num">'+(m.correct+m.incorrect?Math.round(m.correct/(m.correct+m.incorrect)*100):0)+'%</td><td class="r num" style="font-weight:600;color:'+(ok?'var(--good)':'var(--ink)')+'">'+nn.toFixed(2)+'</td><td class="r" style="white-space:nowrap"><button class="ib" data-act="mock-edit" data-id="'+esc(m.id)+'" aria-label="Edit">'+ic('edit')+'</button><button class="ib del" data-act="mock-del" data-id="'+esc(m.id)+'" aria-label="Delete">'+ic('trash')+'</button></td></tr>'; }).join('') : '<tr><td colspan="7" class="faint" style="text-align:center;padding:20px">Saved mocks will be listed here.</td></tr>') +
      '</tbody></table></div>' +
    '</section></div>';
}

/* --- LOG --- */
function vLog(){
  const t = today(), L = S.days.log, target = S.core.settings.dailyTarget*60;
  const end = parseKey(t); const start = parseKey(addDays(t, -7*25)); const dow = (start.getDay()+6)%7; start.setDate(start.getDate()-dow);

const Timer = {total:3000, remaining:3000, endAt:0, running:false, iv:null};
function paintTimer(){
  const rem = Timer.running ? Math.max(0, Math.round((Timer.endAt - Date.now())/1000)) : Timer.remaining;
  const s = String(Math.floor(rem/60)).padStart(2,'0') + ':' + String(rem%60).padStart(2,'0');
  const c = $('#clock'); if(c) c.textContent = s;
  const l = $('#clock-lbl'); if(l) l.textContent = Timer.running ? 'Focus on. Phone away.' : (Timer.remaining < Timer.total ? 'Paused · '+hm((Timer.total-Timer.remaining)/60)+' done' : 'Pick a block and start');
  const g = $('#timer-go'); if(g) g.innerHTML = Timer.running ? ic('pause')+' Pause' : ic('play')+(Timer.remaining<Timer.total?' Resume':' Start');
  const mt = $('#minitimer'); mt.classList.toggle('on', Timer.running && UI.tab !== 'today'); $('#minitime').textContent = s;
  if(Timer.running) document.title = s + ' · UPSC 360'; else document.title = 'UPSC 360 Command Centre';
}
function timerTick(){
  if(!Timer.running) return;
  if(Date.now() >= Timer.endAt){ Timer.running = false; clearInterval(Timer.iv); const m = Timer.total/60; Timer.remaining = Timer.total; logMinutes(m, true); beep(); toast('Session complete: '+hm(m)+' added to today. Take a 10-minute break.', 4500); }
  paintTimer();
}
function logMinutes(m, session){
  if(!S.days || m <= 0) return;
  const L = dayLog(today(), true); L.min = Math.round((L.min + m)*10)/10; if(session) L.sessions = (L.sessions||0)+1;
  Store.mark('days'); if(UI.tab==='today' || UI.tab==='log') softRender();
}
let actx = null;
function beep(){ try { actx = actx || new (window.AudioContext||window.webkitAudioContext)(); [0,0.25,0.5].forEach(t => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; g.gain.setValueAtTime(0.0001, actx.currentTime+t); g.gain.exponentialRampToValueAtTime(0.2, actx.currentTime+t+0.02); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+t+0.2); o.connect(g).connect(actx.destination); o.start(actx.currentTime+t); o.stop(actx.currentTime+t+0.22); }); } catch(e){} }

/* files */
const TEXTY = /\.(txt|md|csv|json)$/i;
function readAs(file, how){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); if(how==='text') r.readAsText(file); else r.readAsDataURL(file); }); }
function dataUrlToBlob(u){ const m = /^data:([^,]*?)(;base64)?,(.*)$/s.exec(u); if(!m) return null; let raw; try { raw = m[2] ? atob(m[3]) : unescape(encodeURIComponent(decodeURIComponent(m[3]))); } catch(e){ return null; } const a = new Uint8Array(raw.length); for(let i=0;i<raw.length;i++) a[i] = raw.charCodeAt(i) & 255; return new Blob([a], {type:(m[1]||'').split(';')[0]||'application/octet-stream'}); }
async function storeFile(blob, name){
  if(S.mode === 'cloud' && Store.assets){
    try { const r = await Store.assets.upload(blob); return {url:r.url, assetId:r.id}; }
    catch(e){ return {err:(e && e.code) || 'failed'}; }
  }
  if(S.mode === 'local' && blob.size <= 150*1024){ return {url: await readAs(blob,'data')}; }
  return {err:'too_large'};
}
async function processFiles(files){
  if(!files || !files.length) return;
  const cat = UI.upCat || NOTE_CATEGORIES[0], sub = (UI.upSub==null?'Class notes':UI.upSub).trim() || 'Uploaded files';
  toast('Uploading '+files.length+' file'+(files.length===1?'':'s')+'…', 8000);
  let stored = 0, missed = 0;
  for(const file of Array.from(files)){
    const ext = (file.name.split('.').pop()||'FILE').toUpperCase().slice(0,6);
    const sizeKB = (file.size/1024).toFixed(1)+' KB';
    let content = '';
    if(TEXTY.test(file.name) || (file.type||'').startsWith('text/')){ try { content = String(await readAs(file,'text')).slice(0, 6000); } catch(e){} }
    const r = await storeFile(file, file.name);
    const fileObj = {name:file.name, size:sizeKB, type:ext, url:r.url||'', assetId:r.assetId||null, missing:!r.url};
    if(r.url) stored++; else missed++;
    const note = normNote({id:uid('up'), created:Date.now(), title:file.name.replace(/\.[^/.]+$/,''), category:cat, subFolder:sub, source:'Uploaded '+ext, content: content || ('Filed under '+cat.split(' (')[0]+' › '+sub+'.'), keywords:[ext, cat.split(' ')[0]], file:fileObj});
    putNote(note, true);
  }
  toast(missed ? stored+' file'+(stored===1?'':'s')+' stored. '+missed+' kept as a named note only ('+(S.mode==='local'?'files over 150 KB can’t be kept in a browser copy':'Word files and other unsupported types can’t be stored; save them as PDF')+').' : stored+' file'+(stored===1?'':'s')+' saved to '+cat.split(' (')[0]+'.', missed?7000:3000);
}

/* backup */
function backupJson(){ return JSON.stringify({format:'upsc360', version:3, exportedAt:new Date().toISOString(), core:S.core, days:S.days, notes:S.notes}, null, 2); }
async function exportBackup(){
  const name = 'upsc_360_backup_' + today() + '.json', data = backupJson();
  if(Store.downloads){
    try { await Store.downloads.save({filename:name, data}); toast('Backup saved'); return; }
    catch(e){ if(e && e.code === 'declined') return; if(e && e.code === 'rate_limited'){ toast('A save prompt is already open.'); return; } }
  }
  try { const u = URL.createObjectURL(new Blob([data], {type:'application/json'})); const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u), 4000); toast('Backup downloaded'); }
  catch(e){ toast('Downloads are blocked here.'); }
}
async function importBackup(file){
  let parsed;
  try { parsed = migrate(JSON.parse(await readAs(file,'text'))); }
  catch(e){ toast('That file isn’t a tracker backup. Choose the .json file you downloaded.', 5000); return; }
  const days = Object.keys(parsed.days.log).length;
  confirmBox('Replace your tracker with this backup?', 'The file has <b>'+parsed.core.syllabus.length+'</b> GS topics, <b>'+Object.values(parsed.core.optionalData).reduce((a,l)=>a+l.length,0)+'</b> optional units, <b>'+parsed.notes.length+'</b> notes, <b>'+parsed.core.mocks.length+'</b> mocks, <b>'+parsed.days.tasks.length+'</b> targets'+(days?' and <b>'+days+'</b> logged days':'')+'. What is in the tracker now will be replaced.', 'Replace with backup', () => applyImport(parsed));
}
async function applyImport(p){
  const oldIds = S.notes.map(n=>n.id), oldRoutine = S.days ? S.days.routine : [];
  if(!p.days.routine.length) p.days.routine = oldRoutine.length ? oldRoutine : defaultDays().routine;
  S.core = p.core; S.days = p.days; UI.firstRun = false; UI.seedNotes = false;
  applyTheme();
  // move inline files into the vault's file store
  for(const n of p.notes){
    if(n.file && n.file.url && n.file.url.startsWith('data:') && S.mode === 'cloud' && Store.assets){
      const b = dataUrlToBlob(n.file.url);
      if(b){ const r = await storeFile(b, n.file.name); if(r.url){ n.file.url = r.url; n.file.assetId = r.assetId; n.file.missing = false; } else if(n.file.url.length > 200000){ n.file.url = ''; n.file.missing = true; } }
    }
  }
  S.notes = p.notes.sort((a,b)=>b.created-a.created);
  if(S.mode === 'cloud'){
    const keep = new Set(S.notes.map(n=>n.id));
    oldIds.filter(id => !keep.has(id)).forEach(id => Store.note(() => Store.db.doc('notes/'+id).delete()));
    S.notes.forEach(n => { const b = clone(n); Store.note(() => writeDoc(Store.db.doc('notes/'+n.id), b)); });
  }
  Store.mark('core', true); Store.mark('days', true); if(S.mode==='local') saveLocal();
  render(); toast('Backup restored. From now on every change saves by itself.', 4000);
}

      {name:'gsCutoff', label:'GS cut-off target (out of 200)', type:'number', min:0, max:200, step:0.5, value:st.gsCutoff, half:true}
    ],
    extra:'<hr><div class="row"><button type="button" class="btn" data-act="export">'+ic('download')+' Download backup</button><button type="button" class="btn" data-act="import">'+ic('upload')+' Restore from backup</button></div><p class="faint" style="font-size:12.5px">Restore accepts backups from this tracker and from your old UPSC 360 file.</p><hr><div class="row"><button type="button" class="btn danger" data-act="reset-progress">Reset syllabus progress to 0%</button></div>',
    saveLabel:'Save settings',
    onSave:v => { st.theme = v.theme; if(isKey(v.prelimsDate)) st.prelimsDate = v.prelimsDate; if(isKey(v.mainsDate)) st.mainsDate = v.mainsDate; st.dailyTarget = clamp(num(v.dailyTarget,8),0.5,18); st.gsCutoff = clamp(num(v.gsCutoff,95),0,200); applyTheme(); Store.mark('core'); toast('Settings saved'); return true; }});
}

/* ---------- events ---------- */
const A = {
  tab: el => { UI.tab = el.dataset.tab; render(); window.scrollTo({top:0}); },
  settings: () => openSettings(),
  'dismiss-first': () => { UI.firstRun = false; Store.mark('core'); Store.mark('days'); seedNotesIfNeeded(); render(); },
  import: () => { $('#import-file').click(); },
  export: () => exportBackup(),
  'reset-progress': () => confirmBox('Reset all syllabus progress?', 'Every GS and optional topic goes back to Unread with 0 PYQs solved. Topics, notes, mocks and your study log stay.', 'Reset to 0%', () => { S.core.syllabus.forEach(t=>{t.stage=0;t.pyqDone=0;}); Object.values(S.core.optionalData).forEach(l=>l.forEach(t=>{t.stage=0;t.pyqDone=0;})); Store.mark('core'); render(); toast('Progress reset to 0%'); }),
  'task-toggle': el => { const t = S.days.tasks.find(x=>x.id===el.dataset.id); if(!t) return; t.done = !t.done; t.doneAt = t.done ? today() : null; Store.mark('days'); render(); },
  'task-edit': el => editTask(el.dataset.id),
  'task-del': el => { S.days.tasks = S.days.tasks.filter(x=>x.id!==el.dataset.id); Store.mark('days'); render(); toast('Target deleted'); },
  'task-today': el => { const t = S.days.tasks.find(x=>x.id===el.dataset.id); if(t){ t.date = today(); Store.mark('days'); render(); } },
  'carry-all': () => { const k = today(); S.days.tasks.forEach(t => { if(t.date < k && !t.done) t.date = k; }); Store.mark('days'); render(); },
  'routine-toggle': el => { const L = dayLog(today(), true); L.routine = L.routine || []; const i = L.routine.indexOf(el.dataset.id); if(i>=0) L.routine.splice(i,1); else L.routine.push(el.dataset.id); Store.mark('days'); render(); },
  'routine-edit': el => editRoutine(el.dataset.id),
  'routine-del': el => { S.days.routine = S.days.routine.filter(x=>x.id!==el.dataset.id); Store.mark('days'); render(); },
  'timer-go': () => { if(Timer.running){ Timer.remaining = Math.max(0, Math.round((Timer.endAt-Date.now())/1000)); Timer.running = false; clearInterval(Timer.iv); } else { Timer.endAt = Date.now() + Timer.remaining*1000; Timer.running = true; clearInterval(Timer.iv); Timer.iv = setInterval(timerTick, 1000); try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } paintTimer(); },
  'timer-stop': () => { const rem = Timer.running ? Math.max(0, Math.round((Timer.endAt-Date.now())/1000)) : Timer.remaining; const done = (Timer.total - rem)/60; Timer.running = false; clearInterval(Timer.iv); Timer.remaining = Timer.total; if(done >= 1){ logMinutes(Math.round(done), true); toast(hm(done)+' added to today'); } else toast('Less than a minute, nothing logged'); paintTimer(); },
  'timer-reset': () => { Timer.running = false; clearInterval(Timer.iv); Timer.remaining = Timer.total; paintTimer(); },
  'timer-preset': el => { const m = int(el.dataset.min,50); Timer.running = false; clearInterval(Timer.iv); Timer.total = Timer.remaining = m*60; render(); },
  'log-day': el => editDay(el.dataset.day),
  stage: el => { const t = findTopic(el.dataset.kind, el.dataset.id); if(!t) return; const n = int(el.dataset.n); const ns = t.stage === n ? n-1 : n; if(ns > t.stage) touch(t); t.stage = ns; Store.mark('core'); render(); if(ns===4) toast('Exam ready: '+t.topic.slice(0,48)+(t.topic.length>48?'…':'')); },
  pyq: el => { const t = findTopic(el.dataset.kind, el.dataset.id); if(!t) return; const d = int(el.dataset.d); t.pyqDone = Math.max(0, t.pyqDone + d); if(t.pyqDone > t.pyqCount) t.pyqCount = t.pyqDone; if(d>0) touch(t); Store.mark('core'); render(); },
  'topic-edit': el => editTopic(el.dataset.kind, el.dataset.id),
  'topic-del': el => { const t = findTopic(el.dataset.kind, el.dataset.id); if(!t) return; confirmBox('Delete this topic?', esc(t.topic), 'Delete', () => { const l = topicList(el.dataset.kind); l.splice(l.indexOf(t),1); Store.mark('core'); render(); }); },
  paper: el => { UI.paper = UI.paper === el.dataset.p ? 'ALL' : el.dataset.p; render(); },
  optpaper: el => { UI.optPaper = UI.optPaper === el.dataset.p ? 'ALL' : el.dataset.p; render(); },
  'thinker-edit': el => editThinker(el.dataset.id),
  'thinker-del': el => { S.core.thinkers = S.core.thinkers.filter(x=>x.id!==el.dataset.id); Store.mark('core'); render(); toast('Thinker removed'); },
  'note-new': () => noteForm(null),
  'note-edit': el => noteForm(S.notes.find(x=>x.id===el.dataset.id)),
  'note-del': el => { const n = S.notes.find(x=>x.id===el.dataset.id); if(n) confirmBox('Delete this note?', esc(n.title)+(n.file&&n.file.assetId?' Its stored file is deleted too.':''), 'Delete', () => deleteNote(n.id)); },
  'note-more': el => { UI.expanded[el.dataset.id] = !UI.expanded[el.dataset.id]; render(); },
  notecat: el => { UI.noteCat = el.dataset.c; render(); },
  upload: () => $('#upload-file').click(),
  'mock-type': el => { UI.mock.type = el.dataset.t; render(); },
  'chart-type': el => { UI.chartType = el.dataset.t; render(); },
  'mock-edit': el => editMock(el.dataset.id),
  'mock-del': el => { S.core.mocks = S.core.mocks.filter(x=>x.id!==el.dataset.id); Store.mark('core'); render(); toast('Mock removed'); },
  'modal-close': () => closeModal(),
  'modal-close-scrim': (el, e) => { if(e.target === el) closeModal(); },
  'modal-del': () => { const c = modalCfg; closeModal(); if(c && c.onDel){ c.onDel(); render(); } }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const fn = A[el.dataset.act]; if(!fn) return;
  if(el.dataset.act !== 'modal-close-scrim') e.preventDefault();
  if(!S.core && !['settings'].includes(el.dataset.act)) return;
  fn(el, e);
});
const F = {
  'task-add': (f, d) => { const title = String(d.get('title')||'').trim(); if(!title) return; UI.lastTag = d.get('tag'); S.days.tasks.unshift({id:uid('t'), title, tag:d.get('tag'), done:false, date:addDays(today(), int(d.get('when'))), doneAt:null}); Store.mark('days'); render(); const i = $('#task-title'); if(i){ i.value=''; i.focus(); } toast(int(d.get('when'))?'Added to tomorrow':'Target added'); },
  'routine-add': (f, d) => { const title = String(d.get('title')||'').trim(); if(!title) return; S.days.routine.push({id:uid('r'), title, tag:d.get('tag')}); Store.mark('days'); render(); },
  'manual-time': (f, d) => { const m = clamp(int(d.get('min')),0,720); if(m>0){ logMinutes(m, false); toast(hm(m)+' added to today'); render(); } },
  'topic-add': (f, d) => { const kind = f.dataset.kind; const t = normTopic({paper:d.get('paper'), subject:d.get('subject'), section:d.get('section'), topic:String(d.get('topic')||'').trim(), pyqCount:d.get('pyqCount')||0}, kind); if(!t.topic) return; topicList(kind).push(t); Store.mark('core'); render(); toast('Topic added at 0%'); },
  'thinker-add': (f, d) => { S.core.thinkers.unshift({id:uid('th'), scholar:String(d.get('scholar')).trim(), quote:String(d.get('quote')).trim(), paper:d.get('paper')}); Store.mark('core'); render(); toast('Saved to thinker bank'); },
  'mock-add': (f, d) => { const m = normMock({id:uid('m'), name:UI.mock.name.trim()||'Mock test', type:UI.mock.type, correct:UI.mock.correct, incorrect:UI.mock.incorrect, date:d.get('date')}); S.core.mocks.push(m); UI.mock.name = ''; UI.chartType = m.type; Store.mark('core'); render(); toast('Mock saved: '+net(m).toFixed(2)); },
  modal: (f, d) => { if(!modalCfg) return; const v = {}; d.forEach((val,key) => v[key] = String(val)); const c = modalCfg; if(c.onSave(v) !== false){ closeModal(); render(); } }
};
document.addEventListener('submit', e => { const f = e.target; if(!f.dataset || !f.dataset.form) return; e.preventDefault(); if(!S.core) return; F[f.dataset.form](f, new FormData(f)); });
let jT;
document.addEventListener('input', e => {
  const el = e.target, k = el.dataset && el.dataset.input; if(!k || !S.core) return;
  if(k === 'journal'){ dayLog(today(), true).note = el.value; clearTimeout(jT); jT = setTimeout(() => Store.mark('days', true), 700); Store.dirty.days = true; paintStatus(); return; }
  if(k === 'q'){ UI.q = el.value; render(); return; }
  if(k === 'optQ'){ UI.optQ = el.value; render(); return; }
  if(k === 'noteQ'){ UI.noteQ = el.value; render(); return; }
  if(k === 'upSub'){ UI.upSub = el.value; return; }
  if(k.startsWith('mock.')){ UI.mock[k.slice(5)] = el.value; if(k !== 'mock.name'){ const calcHolder = document.createElement('div'); calcHolder.innerHTML = vMocks(); const nc = calcHolder.querySelector('#calc'); const oc = $('#calc'); if(nc && oc) oc.replaceWith(nc); } return; }
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.id === 'import-file'){ const f = el.files && el.files[0]; el.value = ''; if(f){ closeModal(); importBackup(f); } return; }
  if(el.id === 'upload-file'){ const fs = Array.from(el.files||[]); el.value = ''; processFiles(fs); return; }
  const k = el.dataset && el.dataset.input; if(!k || !S.core) return;
  if(k === 'optional'){ S.core.settings.selectedOptional = el.value; UI.optPaper = 'ALL'; Store.mark('core'); render(); }
  if(k === 'upCat'){ UI.upCat = el.value; render(); }
});
['dragover','dragenter'].forEach(ev => document.addEventListener(ev, e => { const d = e.target.closest && e.target.closest('#drop'); if(d){ e.preventDefault(); d.classList.add('on'); } }));
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('#drop'); if(d) d.classList.remove('on'); });
document.addEventListener('drop', e => { const d = e.target.closest && e.target.closest('#drop'); if(d){ e.preventDefault(); d.classList.remove('on'); processFiles(e.dataTransfer && e.dataTransfer.files); } });

// first real edit in a fresh cloud vault also stores the starter notes
const origMark = Store.mark.bind(Store);
Store.mark = function(which, now){ if(UI.seedNotes && S.mode === 'cloud' && !UI.firstRun) seedNotesIfNeeded(); if(UI.firstRun && S.mode !== 'loading'){ UI.firstRun = false; seedNotesIfNeeded(); } origMark(which, now); };

// roll over at midnight
let lastDay = today();
setInterval(() => { if(today() !== lastDay){ lastDay = today(); if(S.core) render(); } }, 60000);

boot();
})();
</script>

</body>
